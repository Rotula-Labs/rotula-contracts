name: Rotula Contracts CI
permissions:
  contents: read
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: contracts
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      with:
        components: rustfmt, clippy
        targets: wasm32v1-none
    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: ${{ env.WORKING_DIR }}
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Lint with Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build (native)
      run: cargo build
    - name: Run tests
      run: cargo test --verbose
    - name: Build WebAssembly (release)
      run: cargo build --target wasm32v1-none --release
    - name: Upload WASM artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rotula-savings-group-wasm
        path: ${{ env.WORKING_DIR }}/target/wasm32v1-none/release/rotula_savings_group.wasm
        retention-days: 14
    - name: Upload WASM artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: kolo-savings-group-wasm
        path: ${{ env.WORKING_DIR }}/target/wasm32v1-none/release/kolo_savings_group.wasm
        retention-days: 14
    - name: Upload WASM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rotula-savings-group-wasm
        path: ${{ env.WORKING_DIR }}/target/wasm32v1-none/release/rotula_savings_group.wasm
        retention-days: 14
  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      with:
        targets: wasm32v1-none
    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: ${{ env.WORKING_DIR }}
    - name: Install Stellar CLI
      run: 'cargo install stellar-cli --locked

        stellar --version

        '
    - name: Build and optimize WASM
      run: "RUSTFLAGS=\"-C target-cpu=mvp\" cargo build \\\n  --target wasm32v1-none\
        \ \\\n  --release\ncargo install wasm-opt --locked\nwasm-opt \\\n  target/wasm32v1-none/release/rotula_savings_group.wasm\
        \ \\\n  -o target/wasm32v1-none/release/rotula_savings_group.optimized.wasm\n"
    - name: Deploy contract to testnet
      env:
        STELLAR_SOURCE_ACCOUNT: ${{ secrets.STELLAR_DEPLOYER_KEY }}
      run: "stellar contract deploy \\\n  --wasm target/wasm32v1-none/release/rotula_savings_group.optimized.wasm\
        \ \\\n  --source-account \"$STELLAR_SOURCE_ACCOUNT\" \\\n  --network testnet\n"
    - name: Build and optimize WASM
      run: "RUSTFLAGS=\"-C target-cpu=mvp\" cargo build \\\n  --target wasm32v1-none\
        \ \\\n  --release\ncargo install wasm-opt --locked\nwasm-opt \\\n  target/wasm32v1-none/release/kolo_savings_group.wasm\
        \ \\\n  -o target/wasm32v1-none/release/kolo_savings_group.optimized.wasm\n"
    - name: Deploy contract to testnet
      env:
        STELLAR_SOURCE_ACCOUNT: ${{ secrets.STELLAR_DEPLOYER_KEY }}
      run: "stellar contract deploy \\\n  --wasm target/wasm32v1-none/release/kolo_savings_group.optimized.wasm\
        \ \\\n  --source-account \"$STELLAR_SOURCE_ACCOUNT\" \\\n  --network testnet\n"
